<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- 极简高亮与微金属光泽渐变 -->
    <linearGradient id="primaryWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#E2E2E2" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#737373" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="secondaryWave" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#525252" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#D4D4D4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.95" />
    </linearGradient>

    <!-- 中心能量微光晕（极微弱中性灰） -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 300;
      letter-spacing: 0.38em;
      fill: #F5F5F5;
      text-transform: uppercase;
    }
    .brand-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.45em;
      font-size: 10px;
      fill: #737373;
      text-transform: uppercase;
    }
    .glow-core {
      animation: pulse 4s ease-in-out infinite alternate;
    }
  </style>

  <!-- 背景：纯深邃哑光黑（若需透明背景，可删除此 rect） -->
  <rect width="800" height="600" fill="#0A0A0A" />

  <!-- 视觉中心微弱光晕 -->
  <circle cx="400" cy="225" r="140" fill="url(#centerGlow)" />

  <!-- 图形部分：Air & String 互动声波/弦律交汇 -->
  <g transform="translate(0, 0)">
    <!-- 弦线 1：象征玩家输入与空气流动 -->
    <path d="M 310 225 C 310 160, 360 145, 400 225 C 440 305, 490 290, 490 225" fill="none" stroke="url(#primaryWave)" stroke-width="2.5" stroke-linecap="round" />

    <!-- 弦线 2：象征 AI NPC 的反馈与共振，形成交织闭环 -->
    <path d="M 310 225 C 310 290, 360 305, 400 225 C 440 145, 490 160, 490 225" fill="none" stroke="url(#secondaryWave)" stroke-width="2.5" stroke-linecap="round" />

    <!-- 极简核心节点：智能生命交互的触发点 -->
    <circle cx="400" cy="225" r="3.5" fill="#FFFFFF" />
    <circle cx="400" cy="225" r="7" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" />
  </g>

  <!-- 文字排印：AIRSTRING & AI NPC / Interactive -->
  <g text-anchor="middle">
    <!-- 主标题（微移 0.19em 抵消字母间距带来的视觉偏移） -->
    <text x="408" y="385" font-size="28" class="brand-title">AIR STRING</text>
    
    <!-- 副标题：产品定位 -->
    <text x="410" y="420" class="brand-subtitle">AI INTERACTION • NEXT-GEN RPG</text>
  </g>
</svg>